<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>版本对比 · 面料换算</title>
<style>
  :root{
    --n0:#2e3440;--n1:#3b4252;--n2:#434c5e;--n3:#4c566a;--n4:#d8dee9;--n5:#e5e9f0;--n6:#eceff4;
    --n8:#88c0d0;--n9:#81a1c1;--n10:#5e81ac;
    --bg:var(--n5);--panel:var(--n6);--ink:var(--n0);--muted:var(--n3);--line:var(--n4);--acc:var(--n10);
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:var(--n0);--panel:var(--n1);--ink:var(--n6);--muted:var(--n9);--line:var(--n2);--acc:var(--n8)}
  }
  *{box-sizing:border-box}
  body{margin:0;padding:36px 18px 60px;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;line-height:1.6}
  .wrap{max-width:1040px;margin:0 auto}
  h1{margin:0 0 6px;font-size:19px}
  .lead{margin:0 0 24px;color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
  .item{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .item a{display:block;color:inherit;text-decoration:none}
  .item img{display:block;width:100%;height:auto;border-bottom:1px solid var(--line)}
  .meta{padding:11px 14px}
  .meta b{font-size:14px}
  .meta span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .item:hover{border-color:var(--acc)}
  footer{margin-top:22px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>版本对比</h1>
  <p class="lead">四个版本都能点开用，功能完全一样（49 项自检全过），只有界面不同。看中哪个报编号。</p>
  <div class="grid">
    <div class="item"><a href="v1-cards.html">
      <img src="preview-v1-cards.png" alt="版本 1 截图">
      <div class="meta"><b>1 · 原始版本</b><span>浅色卡片、蓝色强调、每张卡有公式条和快捷按钮</span></div>
    </a></div>
    <div class="item"><a href="v2-calc.html">
      <img src="preview-v2-calc.png" alt="版本 2 截图">
      <div class="meta"><b>2 · 计算器皮肤</b><span>深色机身、绿色 LCD 屏、按键式输入、状态行</span></div>
    </a></div>
    <div class="item"><a href="v3-nord.html">
      <img src="preview-v3-nord.png" alt="版本 3 截图">
      <div class="meta"><b>3 · Nord 计算器</b><span>同上，配色换成 Nord：Snow Storm 机身 + Frost 蓝屏</span></div>
    </a></div>
    <div class="item"><a href="v4-panels.html">
      <img src="preview-v4-panels.png" alt="版本 4 截图">
      <div class="meta"><b>4 · 文档五板块（现在线上）</b><span>去掉装饰，五个带描边的板块，左边参数右边结果</span></div>
    </a></div>
  </div>
  <footer>当前线上首页 = 版本 4。选定后我把对应版本设为首页，其余留在 /versions/ 备查。</footer>
</div>
</body>
</html>
